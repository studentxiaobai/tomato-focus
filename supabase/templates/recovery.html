<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;background:#0f1724;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;color:#172033;">
    <div style="max-width:560px;margin:0 auto;padding:40px 20px;">
      <div style="background:#ffffff;border-radius:20px;padding:32px;box-shadow:0 16px 50px rgba(0,0,0,.24);">
        <p style="margin:0 0 8px;color:#ff5264;font-size:12px;font-weight:700;letter-spacing:.12em;">TOMATO FOCUS</p>
        <h1 style="margin:0 0 16px;font-size:26px;">重置密码</h1>
        <p style="margin:0 0 24px;line-height:1.7;color:#596579;">我们收到了你的密码重置请求。点击下面的按钮设置新密码；如果不是你本人操作，可以忽略这封邮件。</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 22px;border-radius:12px;background:#ff5264;color:#ffffff;text-decoration:none;font-weight:700;">设置新密码</a>
        <p style="margin:24px 0 0;color:#8a94a6;font-size:12px;line-height:1.6;">如果按钮无法使用，请复制以下链接到浏览器：<br><a href="{{ .ConfirmationURL }}" style="color:#4e6fba;word-break:break-all;">{{ .ConfirmationURL }}</a></p>
      </div>
    </div>
  </body>
</html>
